<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <nav class="bg-blue-600 text-white p-4">
    <div class="container mx-auto flex justify-between">
      <div class="text-xl font-bold">Crypto Dashboard</div>
      <div>
        <a href="index.html" class="mx-2">Home</a>
        <a href="weather.html" class="mx-2">Weather</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto mt-8">
    <h1 class="text-2xl font-bold mb-4">Cryptocurrency Market Insights</h1>
    <canvas id="cryptoChart"></canvas>
  </main>

  <script>
    async function fetchCrypto() {
      const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd');
      const data = await res.json();
      const labels = data.slice(0, 10).map(x => x.name);
      const prices = data.slice(0, 10).map(x => x.current_price);
      const ctx = document.getElementById('cryptoChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Price (USD)',
            data: prices,
            backgroundColor: 'rgba(16, 185, 129, 0.6)',
            borderColor: 'rgba(16, 185, 129, 1)',
            borderWidth: 1
          }]
        }
      });
    }

    fetchCrypto();
  </script>
</body>
</html>
