<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Dashboard</title>

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      margin: 0;
    }

    /* Navbar */
    .navbar-custom {
      background-color: #1a237e;
      font-weight: 600;
    }
    .navbar-custom a {
      color: #fff !important;
      margin-right: 20px;
    }
    .navbar-custom a:hover {
      color: #ffca28 !important;
    }

    /* Heading */
    .page-title {
      font-weight: 800;
      color: #1a237e;
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    /* Currency Dropdown */
    .currency-selector {
      text-align: right;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
    }

    /* Chart Container */
    .chart-container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 20px rgba(0, 0, 0, 0.1);
      height: 500px;
    }

    /* Responsive Fixes */
    @media (max-width: 768px) {
      .currency-selector {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom p-3">
    <div class="container">
      <a class="navbar-brand font-weight-bold" href="#">Crypto Dashboard</a>
      <div class="ml-auto">
        <a href="index.html" class="nav-link d-inline">Home</a>
        <a href="weather.html" class="nav-link d-inline">Weather</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">
    <h1 class="page-title">Cryptocurrency Market Insights</h1>

    <div class="currency-selector mb-3">
      <label for="currency">Currency:</label>
      <select id="currency" class="form-control d-inline-block w-auto ml-2">
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="myr">MYR</option>
        <option value="gbp">GBP</option>
        <option value="jpy">JPY</option>
      </select>
    </div>
    <div class="row mb-3">
  <div class="col-md-6">
    <input type="text" id="searchInput" class="form-control" placeholder="Search cryptocurrency name...">
  </div>
  <div class="col-md-6">
    <select id="priceFilter" class="form-control">
      <option value="all">All Prices</option>
      <option value="under100">Under 100</option>
      <option value="100to1000">100 - 1000</option>
      <option value="above1000">Above 1000</option>
    </select>
  </div>
</div>


    <div class="chart-container">
      <canvas id="cryptoChart" class="w-100 h-100"></canvas>
    </div>
  </div>

  <!-- JavaScript -->
<script>
  let chart;
  let currentCurrency = 'usd';
  let allCryptoData = [];

  const currencySymbols = {
    usd: '$',
    eur: '€',
    myr: 'RM',
    gbp: '£',
    jpy: '¥'
  };

  async function fetchCrypto(currency = 'usd') {
    currentCurrency = currency;
    const symbol = currencySymbols[currency] || currency.toUpperCase();

    try {
      const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=${currency}`);
      const data = await res.json();
      allCryptoData = data.slice(0, 100); // store up to 100 for filtering
      applyFiltersAndUpdateChart();
    } catch (error) {
      console.error('Error fetching crypto data:', error);
    }
  }

  function applyFiltersAndUpdateChart() {
    const symbol = currencySymbols[currentCurrency] || currentCurrency.toUpperCase();
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const priceFilter = document.getElementById('priceFilter').value;

    let filteredData = allCryptoData.filter(coin =>
      coin.name.toLowerCase().includes(searchTerm)
    );

    if (priceFilter === 'under100') {
      filteredData = filteredData.filter(coin => coin.current_price < 100);
    } else if (priceFilter === '100to1000') {
      filteredData = filteredData.filter(coin => coin.current_price >= 100 && coin.current_price <= 1000);
    } else if (priceFilter === 'above1000') {
      filteredData = filteredData.filter(coin => coin.current_price > 1000);
    }

    const topCoins = filteredData.slice(0, 10);
    const labels = topCoins.map(x => x.name);
    const prices = topCoins.map(x => x.current_price);

    const ctx = document.getElementById('cryptoChart').getContext('2d');
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: `Price (${currentCurrency.toUpperCase()})`,
          data: prices,
          backgroundColor: 'rgba(255, 202, 40, 0.7)',
          borderColor: 'rgba(255, 202, 40, 1)',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            type: 'logarithmic',
            beginAtZero: false,
            title: {
              display: true,
              text: `Price (${currentCurrency.toUpperCase()})`
            },
            ticks: {
              callback: function (value) {
                return symbol + value.toLocaleString();
              }
            }
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function (context) {
                return `${context.label}: ${symbol}${context.parsed.y.toLocaleString()}`;
              }
            }
          }
        }
      }
    });
  }

  // Event Listeners
  document.getElementById('currency').addEventListener('change', function () {
    fetchCrypto(this.value);
  });

  document.getElementById('searchInput').addEventListener('input', applyFiltersAndUpdateChart);
  document.getElementById('priceFilter').addEventListener('change', applyFiltersAndUpdateChart);

  // Initial load
  fetchCrypto();
</script>

</body>
</html>
