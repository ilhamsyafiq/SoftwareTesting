<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-900">

  <nav class="bg-blue-600 text-white p-4 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="text-xl font-bold">Crypto Dashboard</div>
      <div>
        <a href="index.html" class="mx-3 hover:text-green-400 transition">Home</a>
        <a href="weather.html" class="mx-3 hover:text-green-400 transition">Weather</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto mt-10 px-4 max-w-4xl">
    <h1 class="text-3xl font-bold mb-6 text-center">Cryptocurrency Market Insights</h1>

    <div class="mb-4 flex justify-end">
      <label for="currency" class="mr-2 font-semibold">Currency:</label>
      <select id="currency" class="p-2 border rounded">
        <option value="usd" selected>USD</option>
        <option value="eur">EUR</option>
        <option value="myr">MYR</option>
        <option value="gbp">GBP</option>
        <option value="jpy">JPY</option>
      </select>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-lg">
      <canvas id="cryptoChart" class="w-full" style="height: 400px;"></canvas>
    </div>
  </main>

  <script>
    let chart;

    async function fetchCrypto(currency = 'usd') {
      try {
        const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=${currency}`);
        const data = await res.json();

        const labels = data.slice(0, 10).map(x => x.name);
        const prices = data.slice(0, 10).map(x => x.current_price);

        const ctx = document.getElementById('cryptoChart').getContext('2d');

        if (chart) chart.destroy(); // Destroy previous chart to avoid overlap

        chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: `Price (${currency.toUpperCase()})`,
              data: prices,
              backgroundColor: 'rgba(16, 185, 129, 0.6)',
              borderColor: 'rgba(16, 185, 129, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      } catch (error) {
        console.error('Error fetching crypto data:', error);
      }
    }

    // Initial fetch
    fetchCrypto();

    // Update chart on currency change
    document.getElementById('currency').addEventListener('change', (e) => {
      fetchCrypto(e.target.value);
    });
  </script>
  
</body>
</html>
