<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    nav {
      background-color: #1a237e;
      color: white;
      padding: 1rem 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    nav .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav .title {
      font-weight: 700;
      font-size: 1.5rem;
    }
    nav a {
      color: white;
      margin-left: 1.5rem;
      font-weight: 600;
      text-decoration: none;
      border-right: 1px solid #3949ab;
      padding-right: 1rem;
      transition: background-color 0.3s ease;
    }
    nav a:last-child {
      border-right: none;
      margin-right: 0;
    }
    nav a:hover {
      background-color: #3949ab;
      color: #ffca28;
    }

    main.container {
      margin: 3rem auto;
      padding: 0 1rem;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-weight: 900;
      font-size: 2.5rem;
      margin-bottom: 2rem;
      color: #1a237e;
    }

    #city {
      width: 300px;
      padding: 0.5rem 1rem;
      border: 1px solid #3949ab;
      border-radius: 0.375rem;
      font-size: 1rem;
    }

    #city:focus {
      outline: none;
      border-color: #ffca28;
      box-shadow: 0 0 8px rgba(255, 202, 40, 0.7);
    }

    button {
      background-color: #3949ab;
      color: #ffca28;
      border: none;
      padding: 0.6rem 1.5rem;
      font-weight: 700;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-left: 1rem;
    }

    button:hover {
      background-color: #1a237e;
      color: #fff;
    }

    #loading {
      color: #1a237e;
      font-weight: 600;
      margin-left: 1rem;
      display: none;
    }

    .weather-card {
      background: white;
      border-radius: 0.75rem;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      padding: 2rem;
      margin-top: 2rem;
      width: 100%;
      max-width: 960px;
      color: #212529;
    }

    #currentWeather {
      display: flex;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1.5rem;
      color: #1a237e;
    }

    #weatherIcon {
      width: 80px;
      height: 80px;
    }

    #weatherDesc {
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    #weatherTemp {
      font-size: 1.25rem;
      margin-top: 0.25rem;
    }

    #weatherHumidity,
    #weatherWind {
      font-size: 1rem;
      color: #555;
    }

    #weatherChart {
      max-width: 100%;
      height: 400px !important;
    }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <div class="title">Weather Dashboard</div>
      <div>
        <a href="index.html">Home</a>
        <a href="crypto.html">Crypto</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1>Weather Monitoring</h1>
    <div class="flex items-center mb-6 space-x-3">
      <input id="city" type="text" placeholder="Enter city name" />
      <button onclick="fetchWeather()">Search</button>
      <div id="loading">Loading...</div>
    </div>

    <!-- Filtering dropdown -->
    <div id="filterContainer" class="mb-4 hidden">
      <label for="dateFilter" class="mr-2 font-semibold text-gray-700">Filter by Date:</label>
      <select id="dateFilter" class="p-2 border rounded text-gray-800" onchange="filterChartData()">
        <option value="all">All</option>
      </select>
    </div>

    <div class="weather-card">
      <div id="currentWeather" class="hidden">
        <img id="weatherIcon" alt="Weather Icon" />
        <div>
          <h2 id="weatherDesc"></h2>
          <p id="weatherTemp"></p>
          <p id="weatherHumidity"></p>
          <p id="weatherWind"></p>
        </div>
      </div>
      <canvas id="weatherChart"></canvas>
    </div>
  </main>

  <script>
    let weatherChart = null;
    let fullForecastData = [];

    async function fetchWeather() {
      const city = document.getElementById('city').value.trim();
      if (!city) {
        alert('Please enter a city name');
        return;
      }
      document.getElementById('loading').style.display = 'inline';
      document.getElementById('currentWeather').style.display = 'none';
      document.getElementById('filterContainer').classList.add('hidden');

      const apiKey = '9d6265408c215c301aba4987a6bd1ba3';
      try {
        const res = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&units=metric&appid=${apiKey}`);
        if (!res.ok) throw new Error('City not found');
        const data = await res.json();

        const current = data.list[0];
        const iconUrl = `https://openweathermap.org/img/wn/${current.weather[0].icon}@2x.png`;
        document.getElementById('weatherIcon').src = iconUrl;
        document.getElementById('weatherDesc').textContent = current.weather[0].description;
        document.getElementById('weatherTemp').textContent = `Temp: ${current.main.temp} °C`;
        document.getElementById('weatherHumidity').textContent = `Humidity: ${current.main.humidity}%`;
        document.getElementById('weatherWind').textContent = `Wind Speed: ${current.wind.speed} m/s`;
        document.getElementById('currentWeather').style.display = 'flex';

        fullForecastData = data.list;

        populateDateFilterOptions(fullForecastData);
        document.getElementById('filterContainer').classList.remove('hidden');

        updateChart(fullForecastData, data.city.name);
      } catch (err) {
        alert(err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function populateDateFilterOptions(dataList) {
      const select = document.getElementById('dateFilter');
      const uniqueDates = [...new Set(dataList.map(item => item.dt_txt.split(' ')[0]))];

      select.innerHTML = '<option value="all">All</option>';
      uniqueDates.forEach(date => {
        const option = document.createElement('option');
        option.value = date;
        option.textContent = date;
        select.appendChild(option);
      });
    }

    function filterChartData() {
      const selectedDate = document.getElementById('dateFilter').value;
      let filteredData = fullForecastData;

      if (selectedDate !== 'all') {
        filteredData = fullForecastData.filter(item => item.dt_txt.startsWith(selectedDate));
      }

      const cityName = document.getElementById('city').value;
      updateChart(filteredData, cityName);
    }

    function updateChart(dataList, cityName) {
      const labels = dataList.map(x => x.dt_txt);
      const temps = dataList.map(x => x.main.temp);
      const ctx = document.getElementById('weatherChart').getContext('2d');

      if (weatherChart) weatherChart.destroy();

      weatherChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: `Temperature (°C) in ${cityName}`,
            data: temps,
            borderColor: '#1a237e',
            backgroundColor: 'rgba(26, 35, 126, 0.2)',
            fill: true,
            tension: 0.3,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { color: '#212529', maxRotation: 45, minRotation: 45 },
              grid: { color: '#e0e0e0' }
            },
            y: {
              beginAtZero: false,
              title: {
                display: true,
                text: 'Temperature (°C)',
                color: '#212529',
                font: { weight: '700' }
              },
              ticks: { color: '#212529' },
              grid: { color: '#e0e0e0' }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#1a237e', font: { weight: '700' } }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
